<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench embedding fixture</title>
<style>
body { margin: 16px; font: 16px system-ui; display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); gap: 16px; height: calc(100dvh - 32px); }
section { overflow: auto; min-height: 0; }
textarea { display: block; width: 95%; height: 100px; }
button { min-height: 44px; margin: 8px 4px 8px 0; }
iframe { width: 100%; height: 100%; min-width: 0; min-height: 0; box-sizing: border-box; border: 1px solid #aaa; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<section aria-label="Host controls">
<label>Authored source<textarea id="source">\begin{tikzpicture}
\draw[blue] (0,0) circle (1cm);
\end{tikzpicture}</textarea></label>
<button id="load">Load source</button>
<button id="copy-source">Copy current source</button>
<button id="snapshot">Snapshot</button>
<button id="cancel">Cancel snapshot</button>
<label>Original strokes<textarea id="ink">[]</textarea></label>
<button id="import-ink">Import strokes</button>
<label>Stroke key<input id="stroke-key"></label>
<button id="interpret-ink">Interpret stroke</button>
<button id="restore-ink">Restore stroke</button>
<label>Saved snapshot<textarea id="saved-snapshot"></textarea></label>
<button id="load-snapshot">Load snapshot</button>
<button id="dispose">Dispose</button>
<output id="command-result"></output>
<output id="status">Loading editor</output>
<pre id="result"></pre>
</section>
<iframe id="editor" title="Embedded drawing" src="/tikz-editor/index.html"></iframe>
<script type="module" src="/embedding.ts"></script>
</html>
