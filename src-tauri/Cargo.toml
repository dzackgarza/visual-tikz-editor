[package]
name = "visual-tikz-editor"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = ["config-toml"] }

[dependencies]
tauri = { version = "2", features = ["config-toml"] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "=2.3.2"
libc = "0.2"
webkit2gtk = "2.0"
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
gio = "0.18"
html-escape = "0.2"
